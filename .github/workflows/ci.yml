name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      API_ORIGIN: http://localhost:8000
      JWT_SECRET: ci-only-secret-at-least-32-bytes-long-xx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

      # The e2e spec needs the real backend: check out the API repo and bring
      # up its compose stack (db + api), then apply migrations.
      - uses: actions/checkout@v4
        with:
          repository: dikology/umbrella-api
          path: umbrella-api
          # umbrella-api is private; the default GITHUB_TOKEN can't read it.
          token: ${{ secrets.API_REPO_TOKEN }}
      - run: docker compose up -d --build --wait db api
        working-directory: umbrella-api
      - run: docker compose exec -T api alembic upgrade head
        working-directory: umbrella-api
      # The Reader needs Dictionary Entries, and CI never downloads CC-CEDICT: load
      # the API's committed sample. .dockerignore keeps tests/ out of the image,
      # so the file goes into the container first.
      - run: |
          docker compose cp tests/fixtures/cedict-sample.u8 api:/tmp/cedict-sample.u8
          docker compose exec -T api umbrella-api import-dictionary --file /tmp/cedict-sample.u8
        working-directory: umbrella-api
      # HSK Levels for the Reader and Marked Words: the syllabus is vendored in the
      # image, so the real one loads.
      - run: docker compose exec -T api umbrella-api import-hsk
        working-directory: umbrella-api

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
